<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Applications | LinkedOut</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/webp" href="/IMG/Logo.jpeg" />
    <style>
        /* Central Modal Animations */
@keyframes central-pop {
    from { transform: scale(0.95) translateY(20px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
}

.animate-central-pop {
    animation: central-pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}

#central-modal-overlay.active {
    display: flex !important;
}

/* Glassmorphic Backdrop */
.modal-backdrop {
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(8px);
}
    </style>
</head>
<body class="bg-slate-50 font-sans antialiased text-slate-900">

    <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-100 px-6 h-16 flex items-center justify-between">
        <div class="flex items-center gap-4">
            <a href="/PAGES/dashboard.html" class="text-slate-400 hover:text-slate-900 transition">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <h1 class="text-sm font-black uppercase tracking-widest text-slate-800">Application Tracker</h1>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-6 py-12">
        <header class="mb-12">
            <h2 class="text-4xl font-black uppercase italic tracking-tighter text-slate-900">Active Signals</h2>
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.3em] mt-2">Tracking all outgoing professional transmissions</p>
        </header>

        <div id="appsContainer" class="space-y-4">
            </div>
            <div id="centralModal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-6">
                <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm"></div>
                
                <div class="relative bg-white w-full max-w-md rounded-[40px] shadow-2xl overflow-hidden animate-modal-in border border-slate-100">
                    <div id="modalContent" class="p-10 text-center">
                        </div>
                </div>
            </div>
    </main>

    <script src="/SCRIPTS/applications.js"></script>
</body>
</html>
