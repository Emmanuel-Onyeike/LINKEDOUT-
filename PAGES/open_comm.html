<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colony Hub | LinkedOut</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="icon" type="image/webp" href="/IMG/Logo.jpeg" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-slide { animation: slideUp 0.5s ease-out forwards; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        
        /* Modal Centering Guardrail */
        #modal-container { z-index: 9999; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-900 overflow-x-hidden">

    <div id="modal-container" class="fixed inset-0 pointer-events-none flex items-center justify-center p-4"></div>

    <header class="relative h-80 bg-slate-900 overflow-hidden">
        <img id="commCover" src="/IMG/Default_Cover.jpeg" class="w-full h-full object-cover opacity-60">
        <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-slate-900/20 to-transparent"></div>
        
        <div class="absolute bottom-0 left-0 w-full p-8">
            <div class="max-w-6xl mx-auto flex items-end gap-6">
                <div class="w-28 h-28 bg-white rounded-[32px] p-1 shadow-2xl shrink-0 translate-y-4">
                    <img id="commIcon" src="/IMG/Logo.jpeg" class="w-full h-full object-cover rounded-[28px]">
                </div>
                <div class="mb-2">
                    <div class="flex items-center gap-3">
                        <h1 id="commTitle" class="text-4xl font-black text-white uppercase tracking-tighter">Scanning...</h1>
                        <span id="roleBadge" class="hidden px-2 py-0.5 bg-amber-400 text-slate-900 text-[8px] font-black uppercase rounded">Founder</span>
                    </div>
                    <p id="commVibe" class="text-cyan-400 text-[10px] font-black uppercase tracking-[0.2em] mt-2 italic opacity-80"></p>
                </div>
            </div>
        </div>

        <a href="/PAGES/dashboard.html" class="absolute top-6 left-6 bg-white/10 backdrop-blur-xl text-white border border-white/20 px-5 py-2.5 rounded-full text-[10px] font-black uppercase tracking-widest hover:bg-white hover:text-slate-900 transition-all duration-300">
            <i class="fa-solid fa-arrow-left mr-2"></i> Exit Colony
        </a>
    </header>

    <main class="max-w-6xl mx-auto py-12 px-6 grid grid-cols-1 lg:grid-cols-12 gap-10">
        
        <aside class="lg:col-span-4 space-y-6">
            <div class="bg-white border border-slate-200 rounded-[40px] p-8 shadow-sm">
                <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Colony Intel</h3>
                <p id="commFullDesc" class="text-sm text-slate-600 leading-relaxed font-medium mb-8">Initializing colony data from the wasteland...</p>
                
                <div class="grid grid-cols-2 gap-4 py-6 border-t border-slate-50">
                    <div>
                        <p id="memberCount" class="text-xl font-black text-slate-800">--</p>
                        <p class="text-[9px] font-bold text-slate-400 uppercase">Active Loafers</p>
                    </div>
                    <div>
                        <p id="maxLimit" class="text-xl font-black text-slate-800">--</p>
                        <p class="text-[9px] font-bold text-slate-400 uppercase">Total Slots</p>
                    </div>
                </div>

                <button id="leaveButton" onclick="leaveCommunity()" class="w-full mt-4 py-4 rounded-2xl text-[9px] font-black uppercase tracking-widest text-slate-400 hover:text-red-500 hover:bg-red-50 transition-all border border-transparent hover:border-red-100">
                    Abandon Colony
                </button>
            </div>

            <div class="bg-white border border-slate-200 rounded-[40px] p-8 shadow-sm">
                <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-6 flex justify-between">
                    Current Occupants <span id="occupantCount" class="text-slate-800">0</span>
                </h3>
                <div id="membersList" class="space-y-4 max-h-60 overflow-y-auto custom-scrollbar">
                    </div>
            </div>
        </aside>

        <section class="lg:col-span-8 space-y-8">
            <div id="adminPostBox" class="hidden bg-white border border-cyan-500/30 rounded-[40px] p-8 shadow-xl shadow-cyan-500/5">
                <div class="flex items-center gap-3 mb-6">
                    <div class="w-2 h-2 rounded-full bg-cyan-500 animate-pulse"></div>
                    <span class="text-[9px] font-black text-cyan-600 uppercase tracking-widest">Founder Transmission</span>
                </div>
                <textarea id="adminPostInput" placeholder="Broadcast a signal to all colony members..." class="w-full bg-slate-50 border-none rounded-3xl p-6 text-sm font-medium focus:ring-2 focus:ring-cyan-500/20 resize-none h-32 transition-all"></textarea>
                <div class="flex justify-end mt-4">
                    <button onclick="publishAdminPost()" class="bg-slate-900 text-white px-10 py-4 rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-cyan-600 transition-all active:scale-95 shadow-lg shadow-slate-900/10">
                        Broadcast Signal
                    </button>
                </div>
            </div>

            <div id="colonyFeed" class="space-y-6">
                <div class="animate-pulse space-y-6">
                    <div class="h-40 bg-slate-200 rounded-[40px]"></div>
                    <div class="h-40 bg-slate-200 rounded-[40px]"></div>
                </div>
            </div>
        </section>
    </main>

    <script src="/SCRIPTS/global.js"></script>
    <script src="/SCRIPTS/open_comms.js"></script>
</body>
</html>
