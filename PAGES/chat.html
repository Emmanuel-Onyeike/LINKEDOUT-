<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Comms | LinkedOut</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/CSS/chat.css">
    <link rel="icon" type="image/webp" href="/IMG/Logo.jpeg" />
</head>
<body class="bg-slate-50 font-sans antialiased text-slate-900 overflow-hidden">

    <div id="chatDeploymentOverlay" class="fixed inset-0 z-[200] bg-white/95 backdrop-blur-2xl flex items-center justify-center p-8">
        <div class="max-w-md w-full text-center">
            <div class="w-24 h-24 bg-blue-600 rounded-[32px] flex items-center justify-center mx-auto mb-10 shadow-2xl shadow-blue-200">
                <i class="fa-solid fa-microchip text-white text-3xl animate-pulse"></i>
            </div>
            <h2 class="text-xs font-black uppercase tracking-[0.5em] text-slate-900 mb-4">Encryption Sync</h2>
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em] leading-relaxed">
                Engineers are currently deploying <br> 
                <span class="text-blue-600">End-to-End Signal Protection</span>.
            </p>
            
            <div class="mt-12 flex justify-center gap-4">
                <div class="w-2 h-2 bg-blue-600 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
                <div class="w-2 h-2 bg-blue-600 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
                <div class="w-2 h-2 bg-blue-600 rounded-full animate-bounce" style="animation-delay: 0.3s"></div>
            </div>

            <button onclick="window.location.href='/PAGES/dashboard.html'" class="mt-16 text-[9px] font-black uppercase tracking-[0.3em] text-slate-400 hover:text-blue-600 transition-all">
                <i class="fa-solid fa-terminal mr-2"></i> Exit to Dashboard
            </button>
        </div>
    </div>

    <main class="flex h-screen opacity-10 pointer-events-none">
        <aside class="w-80 bg-white border-r border-slate-100 p-8">
            <h2 class="text-[10px] font-black uppercase tracking-[0.3em] mb-10 text-slate-400">Signals</h2>
            <div class="space-y-6">
                <div class="w-full h-12 bg-slate-50 rounded-2xl"></div>
                <div class="w-full h-12 bg-slate-50 rounded-2xl"></div>
                <div class="w-full h-12 bg-slate-50 rounded-2xl"></div>
            </div>
        </aside>

        <section class="flex-1 flex flex-col bg-slate-50">
            <header class="h-20 bg-white border-b border-slate-100 px-10 flex items-center">
                <div class="w-10 h-10 bg-slate-100 rounded-full"></div>
            </header>
            <div class="flex-1 p-10">
                </div>
            <div class="p-10 bg-white">
                <div class="h-16 w-full bg-slate-50 rounded-[20px]"></div>
            </div>
        </section>
    </main>

    <script src="/SCRIPTS/chat.js"></script>
</body>
</html>
