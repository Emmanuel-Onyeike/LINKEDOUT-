<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>LinkedOut | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/CSS/dashboard.css">
    <link rel="icon" type="image/webp" href="/IMG/Logo.jpeg" />
    <link rel="stylesheet" href="/SCRIPTS/alerts.js">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="bg-[#f3f2ef] min-h-screen">
    <header class="bg-[#1a2533] text-white px-4 sticky top-0 z-50 shadow-md pt-[env(safe-area-inset-top)]">
        <div class="max-w-6xl mx-auto flex items-center justify-between w-full h-16">
           
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-0 group cursor-pointer shrink-0">
                    <span class="text-cyan-600 font-black text-2xl tracking-tighter hidden sm:block">
                        Linked
                    </span>
                    <div class="ml-0.5 w-9 h-9 bg-cyan-600 text-white px-1 rounded font-black text-sm rounded-md flex items-center justify-center flex-shrink-0 transition-transform group-hover:scale-105">
                        <span class="bg-cyan-600 text-white px-1 rounded font-black text-sm leading-none" style="letter-spacing: -1px;">
                            Out
                        </span>
                    </div>
                </div>
   
                <div class="hidden md:flex items-center bg-slate-800/50 border border-slate-700 rounded-lg px-3 py-1.5 w-64 transition-all focus-within:bg-white focus-within:w-80 group">
                    <i class="fa-solid fa-magnifying-glass text-slate-400 group-focus-within:text-slate-600 mr-2 text-sm"></i>
                    <input type="text" placeholder="Search for loafs..." class="bg-transparent border-none outline-none text-xs font-bold text-white focus:text-slate-900 w-full placeholder:text-slate-500">
                </div>
            </div>
   
            <div class="flex items-center gap-2 sm:gap-4">
               
                <div class="flex items-center gap-1 border-r border-slate-700 pr-2 sm:pr-4">
                    <button id="themeToggle" onclick="toggleDarkMode()" class="text-slate-400 hover:text-cyan-500 transition p-2">
                        <i id="themeIcon" class="fa-solid fa-moon text-lg"></i>
                    </button>
                    <button
                      onclick="toggleLinkedOutModal()"
                      class="text-cyan-400 flex items-center gap-2 group px-3 py-1.5 bg-slate-800/50 rounded-xl border border-slate-700 transition-all hover:bg-slate-700/50 hover:border-cyan-500/50 active:scale-95"
                    >
                      <i class="fa-solid fa-table-cells text-lg"></i>
                      <span class="text-[10px] font-black uppercase tracking-wider hidden xs:block">Suites</span>
                    </button>
                </div>
   
                <div class="flex items-center gap-2">
                    <button onclick="window.location.href='/PAGES/settings.html'" class="text-slate-400 hover:text-cyan-500 transition p-2">
                        <i class="fa-solid fa-gear text-lg"></i>
                    </button>
                    <button onclick="window.location.href='/PAGES/notifications.html'" class="text-slate-400 hover:text-cyan-500 transition p-2 relative group">
                        <i class="fa-solid fa-bell text-lg"></i>
                        <span class="absolute top-2 right-2 w-2 h-2 bg-red-500 rounded-full border-2 border-red-500"></span>
                    </button>
                    <div class="relative">
                        <button onclick="toggleProfileMenu()" class="flex items-center focus:outline-none">
                            <img id="dashPfp" src="/IMG/Logo.jpeg" class="w-9 h-9 rounded-full border-2 border-slate-500 object-cover shadow-lg hover:border-cyan-400 transition-all">
                        </button>
               
                        <div id="profileDropdown" class="hidden absolute right-0 mt-4 w-48 bg-[#1a2533] rounded-2xl shadow-2xl border border-slate-700 overflow-hidden z-[70]">
                            <div class="p-4 border-b border-slate-700 bg-slate-800/30">
                                <p class="text-[10px] font-black text-white uppercase tracking-tighter">Loafer #1</p>
                                <p class="text-[9px] text-cyan-400 font-bold uppercase">Pro Member</p>
                            </div>
                            <div class="p-2">
                                <a href="profile.html" class="flex items-center gap-3 px-3 py-2 text-xs font-bold text-slate-300 hover:bg-slate-800 hover:text-white rounded-lg transition">
                                    <i class="fa-solid fa-user w-4"></i> View Profile
                                </a>
                                <a href="settings.html" class="flex items-center gap-3 px-3 py-2 text-xs font-bold text-slate-300 hover:bg-slate-800 hover:text-white rounded-lg transition">
                                    <i class="fa-solid fa-shield-halved w-4"></i> Privacy
                                </a>
                                <hr class="my-2 border-slate-700">
                                <a href="/index.html" class="flex items-center gap-3 px-3 py-2 text-xs font-bold text-red-400 hover:bg-red-500/10 rounded-lg transition">
                                    <i class="fa-solid fa-right-from-bracket w-4"></i> Sign Out
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
   
        </div>
    </header>

    <!-- MODAL - Renamed and fixed -->
    <div id="linkedOutModalOverlay" class="fixed inset-0 bg-slate-900/80 backdrop-blur-xl z-[100] hidden flex items-center justify-center p-4 transition-opacity duration-300">
        <div id="linkedOutDropdown" class="bg-[#1a2533] w-full max-w-sm rounded-[3rem] p-8 border border-slate-700 shadow-2xl scale-95 opacity-0 transition-all duration-300">
            <div class="flex justify-between items-center mb-8 px-2">
                <h3 class="text-blue-400 text-sm font-black uppercase tracking-widest opacity-50">LinkedOut Suites</h3>
                <button 
                    onclick="toggleLinkedOutModal()"
                    class="text-slate-400 hover:text-white text-3xl leading-none font-light hover:scale-110 transition-transform"
                >×</button>
            </div>
           
            <div class="suites-grid grid grid-cols-3 gap-4 sm:gap-6">
                <a href="dashboard.html" class="suite-item">
                    <div class="icon-box"><i class="fa-solid fa-house"></i></div>
                    <span>Home</span>
                </a>
                <a href="/PAGES/post.html" class="suite-item">
                    <div class="icon-box"><i class="fa-solid fa-pen-to-square"></i></div>
                    <span>Post</span>
                </a>
                <a href="/PAGES/community.html" class="suite-item">
                    <div class="icon-box"><i class="fa-solid fa-users"></i></div>
                    <span>Comm.</span>
                </a>
                <a href="/PAGES/foryou.html" class="suite-item">
                    <div class="icon-box"><i class="fa-solid fa-star"></i></div>
                    <span>For You</span>
                </a>
                <a href="trending.html" class="suite-item">
                    <div class="icon-box"><i class="fa-solid fa-fire"></i></div>
                    <span>Trends</span>
                </a>
                <a href="subscribe.html" class="suite-item">
                    <div class="icon-box"><i class="fa-solid fa-gem"></i></div>
                    <span>Sub</span>
                </a>
                <a href="recommendations.html" class="suite-item group">
                    <div class="icon-box">
                        <i class="fa-solid fa-wand-magic-sparkles transition-transform group-hover:rotate-12"></i>
                    </div>
                    <span class="text-[9px] font-black uppercase mt-1 tracking-wider">Recommend</span>
                </a>
                <a href="jobs.html" class="suite-item">
                    <div class="icon-box"><i class="fa-solid fa-briefcase"></i></div>
                    <span>Jobs</span>
                </a>
                <a href="archive.html" class="suite-item">
                    <div class="icon-box">
                        <i class="fa-solid fa-box-archive"></i>
                    </div>
                    <span class="text-[9px] font-black uppercase mt-1 tracking-wider">Archive</span>
                </a>
                <a href="chat.html" class="suite-item">
                    <div class="icon-box"><i class="fa-solid fa-comment-dots"></i></div>
                    <span>Chat</span>
                </a>
                <a href="profile.html" class="suite-item">
                    <div class="icon-box"><i class="fa-solid fa-user-gear"></i></div>
                    <span>Profile</span>
                </a>
            </div>
        </div>
    </div>

    <main class="max-w-6xl mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        <!-- Your aside, feed, hub, etc. – unchanged -->
        <aside class="lg:col-span-3 space-y-4">
            <!-- ... your profile card, communities card ... -->
        </aside>

        <div class="lg:col-span-6 space-y-4">
            <!-- post input, feed, hub, placeholder – unchanged -->
        </div>

        <aside class="hidden lg:block lg:col-span-3 space-y-4">
            <!-- news, add to feed, footer – unchanged -->
        </aside>
    </main>

    <!-- Global Modal (your existing one) -->
    <div id="globalModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md hidden flex items-center justify-center z-[150] p-6">
        <div class="bg-white w-full max-w-sm rounded-[3rem] shadow-2xl p-10 text-center scale-95 transition-transform duration-300" id="modalContainer">
            <div class="text-6xl mb-4" id="modalEmoji">🛋️</div>
            <h2 id="modalTitle" class="text-2xl font-black text-slate-900 mb-2">Alert</h2>
            <p id="modalBody" class="text-slate-500 mb-8 italic text-sm">Message</p>
            <button onclick="closeModal()" class="w-full bg-[#1a2533] text-white py-4 rounded-2xl font-bold hover:bg-cyan-500 transition-all">Understood</button>
        </div>
    </div>

    <!-- Scripts - correct order with defer -->
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="/SCRIPTS/global.js"></script>
    <script src="/SCRIPTS/dashboard.js"></script>
    <script src="/SCRIPTS/auth.js"></script>
    <script src="/SCRIPTS/dashboard-profile.js"></script>
    <script src="/SCRIPTS/recruitment-engine.js"></script>
</body>
</html>
