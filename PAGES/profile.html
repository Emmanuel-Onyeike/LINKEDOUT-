<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identity | LinkedOut</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/CSS/profile.css">
    <link rel="icon" type="image/webp" href="/IMG/Logo.jpeg" />
</head>
<body class="bg-slate-50 font-sans antialiased text-slate-900">

    <div id="loadingOverlay" class="fixed inset-0 z-[300] bg-white/90 backdrop-blur-md hidden items-center justify-center">
        <div class="text-center">
            <div class="w-16 h-16 border-4 border-slate-100 border-t-blue-600 rounded-full animate-spin mx-auto mb-6"></div>
            <p class="text-[10px] font-black uppercase tracking-[0.4em] text-slate-400">Syncing Identity...</p>
        </div>
    </div>

    <div id="successModal" class="fixed inset-0 z-[400] hidden items-center justify-center p-6">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm"></div>
        <div class="relative bg-white w-full max-w-sm rounded-[44px] p-12 text-center shadow-2xl animate-modal-pop">
            <div class="w-20 h-20 bg-green-50 text-green-500 rounded-full flex items-center justify-center mx-auto mb-8">
                <i class="fa-solid fa-check text-3xl"></i>
            </div>
            <h2 class="text-xl font-black uppercase italic tracking-tighter mb-2">Protocol Updated</h2>
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-10">Your professional signals are now live.</p>
            <button onclick="window.location.href='/PAGES/dashboard.html'" class="w-full py-5 bg-slate-900 text-white text-[9px] font-black uppercase tracking-widest rounded-2xl">Return to Dashboard</button>
        </div>
    </div>

    <main class="max-w-4xl mx-auto px-6 py-20">
        <div class="flex justify-between items-center mb-12">
            <a href="/PAGES/dashboard.html" class="text-slate-400 hover:text-slate-900"><i class="fa-solid fa-arrow-left"></i></a>
            <button id="editBtn" onclick="enableEditMode()" class="text-[9px] font-black uppercase tracking-widest px-8 py-4 bg-white border border-slate-200 rounded-full hover:border-slate-900 transition-all">Edit Profile</button>
        </div>

        <section class="bg-white border border-slate-100 rounded-[44px] p-12 shadow-sm">
            <div class="flex flex-col md:flex-row items-center gap-12">
               <div class="relative group">
    <img id="displayPfp" src="/IMG/Logo.jpeg" 
        class="w-44 h-44 rounded-[40px] object-cover border-4 border-white shadow-2xl transition-all duration-500 group-hover:scale-[1.02]">
    
    <input type="file" id="pfpInput" class="hidden" accept="image/*" onchange="handleFileInput(event)">
    
    <button id="pfpUploadBtn" onclick="document.getElementById('pfpInput').click()" 
        class="absolute inset-0 bg-slate-900/60 rounded-[40px] opacity-0 group-hover:opacity-100 transition-all duration-300 hidden items-center justify-center text-white text-2xl backdrop-blur-[2px]">
        <div class="flex flex-col items-center gap-2">
            <i class="fa-solid fa-camera-retro animate-bounce"></i>
            <span class="text-[8px] font-black uppercase tracking-[0.2em]">Change Signal</span>
        </div>
    </button>
</div>

                <div class="flex-1 text-center md:text-left">
                    <div id="viewState">
                        <h1 id="dashName"  class="text-4xl font-black uppercase italic tracking-tighter text-slate-900">Loafer #1</h1>
                        <p id="displayRole" class="text-[10px] font-black text-blue-600 uppercase tracking-[0.4em] mt-2">Professional Napper @ LinkedOut</p>
                    </div>
                    <div id="tierBadge" class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full mt-3 transition-all duration-500">
                        <i id="tierIcon" class="fa-solid fa-shield-check text-[10px]"></i>
                        <span id="tierText" class="text-[8px] font-black uppercase tracking-[0.2em]">Authenticating...</span>
                    </div>
                    <div id="editState" class="hidden space-y-4">
                        <input type="text" id="editName" class="w-full bg-slate-50 border border-slate-200 rounded-2xl py-4 px-6 text-sm font-bold outline-none focus:border-blue-600" placeholder="Full Name">
                        <input type="text" id="editRole" class="w-full bg-slate-50 border border-slate-100 rounded-2xl py-4 px-6 text-sm font-bold outline-none focus:border-blue-600" placeholder="Professional Role">
                    </div>

                    <div id="actionControls" class="mt-10 flex gap-4 justify-center md:justify-start hidden">
                        <button onclick="saveIdentity()" class="px-10 py-5 bg-blue-600 text-white text-[9px] font-black uppercase tracking-widest rounded-2xl shadow-lg shadow-blue-200">Save Signal</button>
                        <button onclick="cancelEdit()" class="px-10 py-5 bg-slate-100 text-slate-400 text-[9px] font-black uppercase tracking-widest rounded-2xl">Cancel</button>
                    </div>
                </div>
            </div>
        </section>
    </main>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="/SCRIPTS/global.js"></script>
    <script src="/SCRIPTS/dashboard.js"></script>
    <script src="/SCRIPTS/auth.js"></script>
    <script src="/SCRIPTS/dashboard-profile.js"></script>
    <script src="/SCRIPTS/profile.js"></script>

</body>
</html>
