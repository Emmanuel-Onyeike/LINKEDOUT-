<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recommendations | LinkedOut</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
   
</head>
<body class="bg-slate-50 dark:bg-slate-950 font-sans antialiased text-slate-900 transition-colors duration-500">

    <nav class="sticky top-0 z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-100 dark:border-slate-800">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <a href="/PAGES/dashboard.html" class="text-slate-400 hover:text-slate-900 dark:hover:text-white transition">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>
                <h1 class="text-sm font-black uppercase tracking-widest text-slate-800 dark:text-slate-100">Recommendations</h1>
            </div>
            <img id="dashPfpNav" src="/IMG/Logo.jpeg" class="w-8 h-8 rounded-full border border-slate-200 object-cover">
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-6 py-12">
        <div class="relative mb-8">
            <i class="fa-solid fa-magnifying-glass absolute left-6 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" id="userSearch" placeholder="SEARCH FOR USERS..." 
                   class="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-[24px] py-5 pl-14 pr-6 text-[10px] font-black uppercase tracking-widest focus:border-cyan-500 outline-none transition-all shadow-sm dark:text-white">
        </div>

        <div class="flex flex-wrap gap-3 mb-12" id="filterGroup">
            <button class="filter-btn px-6 py-2 rounded-full border border-slate-200 dark:border-slate-800 text-[10px] font-black uppercase tracking-widest transition-all" data-filter="verified">Verified</button>
            <button class="filter-btn px-6 py-2 rounded-full border border-slate-200 dark:border-slate-800 text-[10px] font-black uppercase tracking-widest transition-all" data-filter="unverified">Unverified</button>
            <button class="filter-btn active bg-cyan-500 text-white px-6 py-2 rounded-full text-[10px] font-black uppercase tracking-widest" data-filter="tier1">Tier 1</button>
            <button class="filter-btn px-6 py-2 rounded-full border border-slate-200 dark:border-slate-800 text-[10px] font-black uppercase tracking-widest transition-all" data-filter="tier2">Tier 2</button>
            <button class="filter-btn px-6 py-2 rounded-full border border-slate-200 dark:border-slate-800 text-[10px] font-black uppercase tracking-widest transition-all" data-filter="tier3">Tier 3</button>
        </div>

        <div id="recommendationContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            </div>
    </main>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="/SCRIPTS/global.js"></script>
    <script src="/SCRIPTS/dashboard.js"></script>
    <script src="/SCRIPTS/auth.js"></script>
    <script src="/SCRIPTS/dashboard-profile.js"></script>
    <script src="/SCRIPTS/recommendations.js"></script>
</body>
</html>
