<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recommendations | LinkedOut</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/CSS/recommendations.css">
    <link rel="stylesheet" href="/SCRIPTS/alerts.js">
    <link rel="icon" type="image/webp" href="/IMG/Logo.jpeg" />
</head>
<body class="bg-slate-50 font-sans antialiased text-slate-900">

    <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-100">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <a href="/PAGES/dashboard.html" class="text-slate-400 hover:text-slate-900 transition">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>
                <h1 class="text-sm font-black uppercase tracking-widest text-slate-800">Recommendations/h1>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-6 py-12">
        <div class="relative mb-8">
            <i class="fa-solid fa-magnifying-glass absolute left-6 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" id="userSearch" placeholder="SEARCH FOR USERS..." 
                   class="w-full bg-white border border-slate-200 rounded-[24px] py-5 pl-14 pr-6 text-[10px] font-black uppercase tracking-widest focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 outline-none transition-all shadow-sm">
        </div>

        <div class="flex flex-wrap gap-3 mb-12">
            <button class="filter-btn active" data-filter="verified">Verified</button>
            <button class="filter-btn" data-filter="unverified">Unverified</button>
            <button class="filter-btn" data-filter="tier1">Tier 1</button>
            <button class="filter-btn" data-filter="tier2">Tier 2</button>
            <button class="filter-btn" data-filter="tier3">Tier 3</button>
        </div>

        <div id="recommendationContainer" class="flex flex-col items-center justify-center py-24 px-10 bg-white border border-dashed border-slate-300 rounded-[40px] text-center animate-pulse-subtle">
            <div class="w-20 h-20 bg-slate-50 rounded-full flex items-center justify-center mb-6 relative">
                <i class="fa-solid fa-user-slash text-slate-300 text-3xl"></i>
                <div class="absolute inset-0 border-2 border-slate-100 rounded-full animate-ping opacity-20"></div>
            </div>
            <h3 class="text-xs font-black uppercase tracking-[0.3em] text-slate-800 mb-2">No users Detected</h3>
            <p class="text-[11px] font-medium text-slate-500 leading-relaxed max-w-xs">The frequency is currently quiet. Try adjusting your filters or search parameters to find new connections.</p>
        </div>
    </main>

    <script src="/SCRIPTS/recommendations.js"></script>
</body>
</html>
