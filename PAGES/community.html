<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colonies | LinkedOut</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/CSS/comm.css">
    <link rel="icon" type="image/webp" href="/IMG/Logo.jpeg" />
    <style>
        #modal-container { z-index: 9999; }
        @keyframes modalBounce { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .modal-bounce { animation: modalBounce 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-900">

    <div id="modal-container" class="fixed inset-0 pointer-events-none flex items-center justify-center p-4 z-[9999]"></div>

    <div id="creatorModal" class="hidden fixed inset-0 z-[9990] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-md">
        <div class="bg-white w-full max-w-lg rounded-[40px] shadow-2xl overflow-hidden border border-slate-200 modal-bounce">
            <div class="p-8">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xs font-black uppercase tracking-[0.2em] text-slate-800">Found New Colony</h2>
                    <button onclick="closeCreatorModal()" class="text-slate-400 hover:text-red-500 transition">
                        <i class="fa-solid fa-circle-xmark text-xl"></i>
                    </button>
                </div>

                <div class="space-y-4">
                    <div id="imagePreviewContainer" onclick="document.getElementById('commFile').click()" class="relative w-full h-32 bg-slate-50 border-2 border-dashed border-slate-200 rounded-3xl flex flex-col items-center justify-center cursor-pointer hover:bg-slate-100 transition group overflow-hidden">
                        <i class="fa-solid fa-camera text-slate-300 mb-2 group-hover:text-cyan-500 transition"></i>
                        <span class="text-[9px] font-black text-slate-400 uppercase">Upload Cover Image</span>
                        <input type="file" id="commFile" class="hidden" accept="image/*" onchange="previewCommImage(this)">
                    </div>

                    <input type="text" id="commName" placeholder="Community Name" class="w-full bg-slate-50 border-none rounded-2xl px-5 py-4 text-xs font-bold focus:ring-2 focus:ring-cyan-500 outline-none">

                    <textarea id="commDesc" placeholder="What is the vibe? (e.g. Mandatory Nap Times)" class="w-full bg-slate-50 border-none rounded-2xl px-5 py-4 text-xs font-bold focus:ring-2 focus:ring-cyan-500 h-24 resize-none outline-none"></textarea>

                    <div>
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 block px-2">Identity Role</label>
                        <select id="roleSelect" onchange="togglePinField(this.value)" class="w-full bg-slate-50 border-none rounded-2xl p-4 text-xs font-bold focus:ring-2 focus:ring-cyan-500 transition">
                            <option value="user">Normal Loafer (Member)</option>
                            <option value="admin">Founder (Admin)</option>
                        </select>
                    </div>

                    <div id="pinField" class="hidden mb-4 animate-slide">
                        <label class="text-[10px] font-black text-cyan-600 uppercase tracking-widest mb-2 block px-2">Set Admin PIN (4 Digits)</label>
                        <input type="password" id="adminPin" maxlength="4" placeholder="••••" class="w-full bg-cyan-50/50 border-2 border-cyan-100 rounded-2xl p-4 text-center text-lg font-black tracking-[0.5em] focus:ring-2 focus:ring-cyan-500 outline-none">
                        <p class="text-[8px] text-cyan-600 font-bold uppercase mt-2 italic px-2">Required for broadcasting signals.</p>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-2">
                            <label class="text-[9px] font-black text-slate-400 uppercase px-2">Min Loafers</label>
                            <input type="number" id="minUsers" value="1" class="w-full bg-slate-50 border-none rounded-2xl px-5 py-4 text-xs font-bold focus:ring-2 focus:ring-cyan-500 outline-none">
                        </div>
                        <div class="space-y-2">
                            <label class="text-[9px] font-black text-slate-400 uppercase px-2">Max Slots</label>
                            <input type="number" id="maxUsers" value="100" class="w-full bg-slate-50 border-none rounded-2xl px-5 py-4 text-xs font-bold focus:ring-2 focus:ring-cyan-500 outline-none">
                        </div>
                    </div>

                    <button onclick="createNewCommunity()" class="w-full bg-slate-900 text-white py-5 rounded-[24px] text-[10px] font-black uppercase tracking-widest hover:bg-cyan-600 transition-all shadow-xl shadow-slate-900/10 active:scale-95 mt-4">
                        Initialize Colony
                    </button>
                </div>
            </div>
        </div>
    </div>

    <nav class="bg-white border-b border-slate-200 py-4 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 flex justify-between items-center">
            <a href="/PAGES/dashboard.html" class="flex items-center gap-2 group">
                <div class="w-8 h-8 bg-slate-900 rounded-lg flex items-center justify-center text-white text-xs">
                    <i class="fa-solid fa-house"></i>
                </div>
                <span class="text-[10px] font-black uppercase tracking-tighter">LinkedOut <span class="text-cyan-500">Colonies</span></span>
            </a>
            <button onclick="openCreatorModal()" class="bg-slate-900 text-white px-6 py-2.5 rounded-full text-[9px] font-black uppercase tracking-widest hover:bg-cyan-600 transition shadow-lg">
                <i class="fa-solid fa-plus mr-2"></i> Found Colony
            </button>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto py-8 px-6 grid grid-cols-1 lg:grid-cols-12 gap-8">
        <aside class="lg:col-span-3 space-y-4">
            <div class="bg-white border border-slate-200 rounded-[32px] p-6 shadow-sm">
                <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Colony Filters</h3>
                <div class="space-y-2">
                    <button class="w-full text-left p-3 rounded-xl bg-cyan-50 text-cyan-600 text-[10px] font-black uppercase">All Sectors</button>
                    <button class="w-full text-left p-3 rounded-xl hover:bg-slate-50 text-slate-400 text-[10px] font-bold uppercase transition">My Colonies</button>
                </div>
                <div class="mt-6 pt-6 border-t border-slate-50 flex items-center justify-between text-slate-400 text-[9px] font-black uppercase cursor-pointer group" onclick="fetchCommunities()">
                    <span id="refreshText" class="group-hover:text-cyan-500 transition">Scan for Signals</span>
                    <i class="fa-solid fa-arrows-rotate group-hover:rotate-180 transition-all duration-500"></i>
                </div>
            </div>
        </aside>

        <section class="lg:col-span-9">
            <div id="communityContainer" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/SCRIPTS/global.js"></script>
    <script src="/SCRIPTS/alerts.js"></script>
    <script src="/SCRIPTS/comm.js"></script>

</body>
</html>
