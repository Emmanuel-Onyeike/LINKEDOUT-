<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colonies | LinkedOut</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/CSS/comm.css">
    <link rel="icon" type="image/webp" href="/IMG/Logo.jpeg" />
</head>
<body class="bg-slate-50 font-sans text-slate-900">
    <!-- Global Modal -->
    <div id="globalModal" class="hidden fixed inset-0 z-[9999] items-center justify-center p-4 bg-slate-900/80 backdrop-blur-sm">
        <div class="bg-white w-full max-w-md rounded-[32px] shadow-2xl overflow-hidden modal-bounce">
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                <h3 id="modalTitle" class="text-sm font-black text-slate-800 uppercase tracking-widest"></h3>
                <button onclick="closeGlobalModal()" class="text-slate-400 hover:text-red-500 transition">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <div id="modalBody" class="p-6 text-center text-sm font-medium text-slate-600 leading-relaxed"></div>
        </div>
    </div>

    <!-- Creator Modal -->
    <div id="creatorModal" class="hidden fixed inset-0 z-[9990] items-center justify-center p-4 bg-slate-900/60 backdrop-blur-md">
        <div class="bg-white w-full max-w-lg rounded-[40px] shadow-2xl overflow-hidden border border-slate-200">
            <div class="p-8">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-sm font-black text-slate-800 uppercase tracking-[0.2em]">Found a New Community</h2>
                    <button onclick="closeCreatorModal()" class="text-slate-300 hover:text-slate-500">
                        <i class="fa-solid fa-circle-xmark text-xl"></i>
                    </button>
                </div>

                <div class="space-y-4">
                    <div id="imagePreviewContainer" onclick="document.getElementById('commFile').click()" class="relative w-full h-32 bg-slate-50 border-2 border-dashed border-slate-200 rounded-3xl flex flex-col items-center justify-center cursor-pointer hover:bg-slate-100 transition group overflow-hidden">
                        <i class="fa-solid fa-camera text-slate-300 mb-2 group-hover:text-cyan-500 transition"></i>
                        <span class="text-[9px] font-black text-slate-400 uppercase">Upload Cover Image</span>
                        <input type="file" id="commFile" class="hidden" accept="image/*" onchange="previewCommImage(this)">
                    </div>

                    <input type="text" id="commName" placeholder="Community Name" class="w-full bg-slate-50 border-none rounded-2xl px-5 py-4 text-xs font-bold focus:ring-2 focus:ring-cyan-500">

                    <textarea id="commDesc" placeholder="What is the vibe? (e.g. Mandatory Nap Times)" class="w-full bg-slate-50 border-none rounded-2xl px-5 py-4 text-xs font-bold focus:ring-2 focus:ring-cyan-500 h-24 resize-none"></textarea>

                    <div class="mb-4">
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 block">Identity Role</label>
                        <select id="roleSelect" onchange="togglePinField(this.value)" class="w-full bg-slate-50 border-slate-100 rounded-2xl p-4 text-xs font-bold focus:ring-2 focus:ring-cyan-500 transition">
                            <option value="user">Normal Loafer (Member)</option>
                            <option value="admin">Founder (Admin)</option>
                        </select>
                    </div>

                    <div id="pinField" class="hidden mb-4 animate-[modalSlideUp_0.3s_ease-out]">
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 block">Set Admin PIN (4 Digits)</label>
                        <input type="password" id="adminPin" maxlength="4" placeholder="****" class="w-full bg-slate-50 border-slate-100 rounded-2xl p-4 text-xs font-bold focus:ring-2 border-2 border-cyan-100">
                        <p class="text-[8px] text-cyan-600 font-bold uppercase mt-2 italic">You'll need this to post broadcasts.</p>
                    </div>

                    <div class="mb-6">
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 block">Assign Admin Username (Optional)</label>
                        <input type="text" id="assignAdmin" placeholder="@username" class="w-full bg-slate-50 border-slate-100 rounded-2xl p-4 text-xs font-bold focus:ring-2 focus:ring-cyan-500">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <input type="number" id="minUsers" placeholder="Min Loafers" class="bg-slate-50 border-none rounded-2xl px-5 py-4 text-xs font-bold focus:ring-2 focus:ring-cyan-500">
                        <input type="number" id="maxUsers" placeholder="Max Loafers" class="bg-slate-50 border-none rounded-2xl px-5 py-4 text-xs font-bold focus:ring-2 focus:ring-cyan-500">
                    </div>
                </div>

                <div class="mt-8 flex gap-3">
                    <button onclick="handleCreateColony()" class="w-full bg-slate-800 text-white px-6 py-4 rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-cyan-600 transition shadow-lg shadow-slate-200 active:scale-95">
                        Establish Colony
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="bg-white border-b border-slate-200 py-3 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 flex justify-between items-center">
            <a href="/PAGES/dashboard.html" class="flex items-center gap-2 group">
                <div class="w-8 h-8 bg-cyan-500 rounded-lg flex items-center justify-center group-hover:rotate-12 transition-transform">
                    <i class="fa-solid fa-users text-white text-xs"></i>
                </div>
                <span class="font-black text-lg tracking-tighter text-slate-800 uppercase">Community</span>
            </a>
            <button onclick="openCreatorModal()" class="bg-slate-800 text-white px-6 py-2 rounded-full text-[10px] font-black uppercase tracking-widest hover:bg-cyan-600 transition-all active:scale-95">
                New Community +
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto py-8 px-6 grid grid-cols-1 lg:grid-cols-12 gap-8">
        <aside class="lg:col-span-3 space-y-4">
            <div class="bg-white border border-slate-200 rounded-[32px] p-6 shadow-sm">
                <h2 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-6">Your Circles</h2>
                <div id="myCirclesList" class="space-y-5">
                    <p class="text-[10px] italic text-slate-300 font-bold uppercase">No circles joined yet...</p>
                </div>
            </div>
        </aside>

        <section class="lg:col-span-6 space-y-6">
            <div class="flex items-center justify-between px-2">
                <h1 class="text-sm font-black text-slate-800 uppercase tracking-widest">Explore Community</h1>
                <div id="refreshBtn" onclick="handleRefresh()" class="flex items-center gap-2 text-[10px] font-bold text-cyan-600 uppercase cursor-pointer group">
                    <i id="refreshIcon" class="fa-solid fa-arrows-rotate transition-transform"></i>
                    <span id="refreshText" class="group-hover:underline">Refresh</span>
                </div>
            </div>
            <div id="communityContainer" class="space-y-6"></div>
        </section>

        <aside class="lg:col-span-3">
            <div class="bg-slate-900 rounded-[40px] p-8 text-white shadow-xl shadow-slate-200 sticky top-24">
                <div class="flex items-center gap-2 mb-8">
                    <i class="fa-solid fa-fire-flame-curved text-orange-400"></i>
                    <h2 class="text-[10px] font-black uppercase tracking-[0.2em]">Hot Gossip</h2>
                </div>
                <div class="space-y-8">
                    <div class="trend-item cursor-pointer">
                        <p class="text-[9px] font-bold text-slate-500 uppercase tracking-wider">Trending in Bed</p>
                        <h4 class="text-xs font-black mt-1 uppercase hover:text-cyan-400 transition">#HeavyBlanketGang</h4>
                    </div>
                    <div class="trend-item cursor-pointer">
                        <p class="text-[9px] font-bold text-slate-500 uppercase tracking-wider">4.2k Loafers talking</p>
                        <h4 class="text-xs font-black mt-1 uppercase hover:text-cyan-400 transition">#MouseMoverHacks</h4>
                    </div>
                </div>
            </div>
        </aside>
    </main>

    <!-- Scripts - order matters -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/SCRIPTS/global.js"></script>
    <script src="/SCRIPTS/alerts.js"></script>
    <script src="/SCRIPTS/comm.js"></script>
</body>
</html>
