<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colony Hub | LinkedOut</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/webp" href="/IMG/Logo.jpeg" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-slide { animation: slideUp 0.5s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-900">

    <header class="relative h-64 bg-slate-200 overflow-hidden">
        <img id="commCover" src="" class="w-full h-full object-cover">
        <div class="absolute inset-0 bg-gradient-to-t from-slate-900/80 to-transparent"></div>
        <div class="absolute bottom-0 left-0 w-full p-8 max-w-6xl mx-auto flex items-end gap-6">
            <div class="w-24 h-24 bg-white rounded-[32px] p-1 shadow-2xl shrink-0">
                <img id="commIcon" src="" class="w-full h-full object-cover rounded-[28px]">
            </div>
            <div class="mb-2">
                <h1 id="commTitle" class="text-3xl font-black text-white uppercase tracking-tighter">Loading Colony...</h1>
                <p id="commVibe" class="text-cyan-400 text-[10px] font-black uppercase tracking-[0.2em] mt-1"></p>
            </div>
        </div>
        <a href="/PAGES/dashboard.html" class="absolute top-6 left-6 bg-white/20 backdrop-blur-md text-white px-4 py-2 rounded-full text-[10px] font-black uppercase tracking-widest hover:bg-white hover:text-slate-900 transition">
            <i class="fa-solid fa-arrow-left mr-2"></i> Exit Colony
        </a>
    </header>

    <main class="max-w-6xl mx-auto py-10 px-6 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <aside class="lg:col-span-4 space-y-6">
            <div class="bg-white border border-slate-200 rounded-[40px] p-8 shadow-sm">
                <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">About Colony</h3>
                <p id="commFullDesc" class="text-sm text-slate-600 leading-relaxed font-medium mb-6"></p>
                <div class="grid grid-cols-2 gap-4 pt-6 border-t border-slate-50">
                    <div>
                        <p id="memberCount" class="text-lg font-black text-slate-800">1</p>
                        <p class="text-[9px] font-bold text-slate-400 uppercase">Loafers</p>
                    </div>
                    <div>
                        <p id="maxLimit" class="text-lg font-black text-slate-800">100</p>
                        <p class="text-[9px] font-bold text-slate-400 uppercase">Capacity</p>
                    </div>
                </div>
            </div>
        </aside>

        <section class="lg:col-span-8 space-y-6">
            <div id="adminPostBox" class="hidden bg-white border-2 border-cyan-500/20 rounded-[40px] p-6 shadow-xl shadow-cyan-500/5 animate-slide">
                <div class="flex items-center gap-3 mb-4">
                    <div class="px-3 py-1 bg-cyan-500 text-white text-[8px] font-black uppercase rounded-full">Founder Tools</div>
                </div>
                <textarea id="adminPostInput" placeholder="Broadcast a message to your colony..." class="w-full bg-slate-50 border-none rounded-3xl p-5 text-sm font-medium focus:ring-2 focus:ring-cyan-500 resize-none h-28"></textarea>
                <div class="flex justify-end mt-4">
                    <button onclick="publishAdminPost()" class="bg-slate-900 text-white px-8 py-3 rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-cyan-600 transition active:scale-95">
                        Broadcast Message
                    </button>
                </div>
            </div>

            <div id="colonyFeed" class="space-y-6">
                </div>
        </section>
    </main>

    <script src="/SCRIPTS/open_comms.js"></script>
</body>
</html>
