<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jobs | LinkedOut</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/CSS/job.css">
    <link rel="icon" type="image/webp" href="/IMG/Logo.jpeg" />
</head>
<body class="bg-slate-50 font-sans antialiased text-slate-900">

    <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-100">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <a href="/PAGES/dashboard.html" class="text-slate-400 hover:text-slate-900 transition">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>
                <h1 class="text-sm font-black uppercase tracking-widest text-slate-800">Job Board</h1>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="window.location.href='/PAGES/notifications.html'" class="text-slate-400 hover:text-cyan-500 transition p-2 relative">
                    <i class="fa-solid fa-bell text-lg"></i>
                    <span class="absolute top-2 right-2 w-2 h-2 bg-cyan-500 rounded-full border-2 border-white"></span>
                </button>
                <button onclick="openPostModal()" class="bg-slate-900 text-white px-5 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-slate-700 transition shadow-lg shadow-slate-900/10">Post a Job</button>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-6 py-12">
        <div class="flex gap-4 mb-10">
            <div class="relative flex-1">
                <i class="fa-solid fa-magnifying-glass absolute left-6 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="jobSearch" placeholder="SEARCH FOR OPPORTUNITIES..." 
                       class="w-full bg-white border border-slate-200 rounded-[20px] py-4 pl-14 pr-6 text-[10px] font-black uppercase tracking-widest focus:border-slate-900 outline-none transition-all shadow-sm">
            </div>
        </div>

        <div id="jobFeed" class="space-y-6">
            <div id="jobLoader" class="flex flex-col items-center py-20">
                <div class="w-10 h-10 border-4 border-slate-200 border-t-slate-900 rounded-full animate-spin"></div>
                <p class="text-[9px] font-black uppercase tracking-widest mt-4 text-slate-400">Fetching Opportunities...</p>
            </div>
        </div>
    </main>

    <div id="postJobModal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-slate-900/60 backdrop-blur-sm p-6">
        <div class="bg-white w-full max-w-lg rounded-[40px] p-10 shadow-2xl animate-modal-in">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xs font-black uppercase tracking-widest text-slate-800">Create Job Post</h2>
                <button onclick="closePostModal()" class="text-slate-400 hover:text-slate-900">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <div class="space-y-4">
                <div class="space-y-1">
                    <label class="text-[8px] font-black uppercase tracking-widest text-slate-400 ml-4">Title</label>
                    <input type="text" id="jobTitle" placeholder="E.G. FRONTEND DEVELOPER" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl text-[10px] font-bold uppercase outline-none focus:border-slate-900 focus:bg-white transition-all">
                </div>

                <div class="space-y-1">
                    <label class="text-[8px] font-black uppercase tracking-widest text-slate-400 ml-4">Description</label>
                    <textarea id="jobDesc" placeholder="DESCRIBE THE ROLE..." rows="4" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl text-[10px] font-bold uppercase outline-none focus:border-slate-900 focus:bg-white transition-all"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-[8px] font-black uppercase tracking-widest text-slate-400 ml-4">Budget (₦)</label>
                        <input type="text" id="jobBudget" placeholder="500,000" class="p-4 w-full bg-slate-50 border border-slate-100 rounded-2xl text-[10px] font-bold uppercase outline-none focus:border-slate-900 focus:bg-white transition-all">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[8px] font-black uppercase tracking-widest text-slate-400 ml-4">Type</label>
                        <input type="text" id="jobType" placeholder="REMOTE / OFFICE" class="p-4 w-full bg-slate-50 border border-slate-100 rounded-2xl text-[10px] font-bold uppercase outline-none focus:border-slate-900 focus:bg-white transition-all">
                    </div>
                </div>
            </div>

            <div class="flex gap-4 mt-8">
                <button onclick="closePostModal()" class="flex-1 py-4 border border-slate-200 rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-slate-50 transition">Cancel</button>
                <button onclick="submitJob()" class="flex-1 py-4 bg-slate-900 text-white rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-slate-700 transition">Publish</button>
            </div>
        </div>
    </div>

    <script src="/SCRIPTS/alerts.js"></script>
    <script src="/SCRIPTS/job.js"></script>
</body>
</html>
