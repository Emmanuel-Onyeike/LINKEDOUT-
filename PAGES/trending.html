<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trending | The Colony</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/CSS/foryou.css">
    <link rel="icon" type="image/webp" href="/IMG/Logo.jpeg" />
</head>
<body class="bg-slate-50 font-sans antialiased text-slate-900">

    <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-100">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <a href="/PAGES/dashboard.html" class="text-slate-400 hover:text-slate-900 transition">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>
                <h1 class="text-sm font-black uppercase tracking-widest text-slate-800">Trending Signals</h1>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-6 py-8">
        <div class="flex gap-4 overflow-x-auto pb-6 no-scrollbar">
            <button class="px-6 py-3 bg-slate-900 text-white rounded-2xl text-[10px] font-black uppercase tracking-widest whitespace-nowrap">Global Feed</button>
            <button class="px-6 py-3 bg-white border border-slate-200 text-slate-400 rounded-2xl text-[10px] font-black uppercase tracking-widest whitespace-nowrap hover:border-slate-900 hover:text-slate-900 transition">Development</button>
            <button class="px-6 py-3 bg-white border border-slate-200 text-slate-400 rounded-2xl text-[10px] font-black uppercase tracking-widest whitespace-nowrap hover:border-slate-900 hover:text-slate-900 transition">Design</button>
            <button class="px-6 py-3 bg-white border border-slate-200 text-slate-400 rounded-2xl text-[10px] font-black uppercase tracking-widest whitespace-nowrap hover:border-slate-900 hover:text-slate-900 transition">Hardware</button>
        </div>

        <div id="trendingFeed" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div id="trendingLoader" class="col-span-full flex flex-col items-center py-32">
                <div class="w-12 h-12 border-4 border-slate-200 border-t-cyan-500 rounded-full animate-spin"></div>
                <p class="text-[10px] font-black uppercase tracking-[0.2em] mt-6 text-slate-400">Scanning Nodes...</p>
            </div>
        </div>
    </main>

    <div id="globalModal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-slate-900/40 backdrop-blur-sm p-6">
        <div class="bg-white w-full max-w-sm rounded-[40px] p-8 shadow-2xl text-center">
            <h2 id="modalTitle" class="text-xs font-black uppercase tracking-widest mb-2 text-slate-800"></h2>
            <p id="modalBody" class="text-[11px] font-medium text-slate-500 leading-relaxed mb-6"></p>
            <button onclick="closeGlobalModal()" class="w-full py-4 bg-slate-900 text-white rounded-2xl text-[10px] font-black uppercase tracking-widest">Acknowledged</button>
        </div>
    </div>

    <script src="/SCRIPTS/trending.js"></script>
</body>
</html>
